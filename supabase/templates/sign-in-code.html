<div style="font-family: Georgia, serif; max-width: 420px; margin: 0 auto; padding: 32px 24px; color: #2b2620; background: #f3efe7;">
  <h2 style="font-weight: 600; margin: 0 0 12px;">Your Levaina code</h2>
  <p style="font-family: Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6; margin: 0 0 20px;">
    Enter this code in the app to sign in. It works once and expires in an hour.
  </p>
  <p style="font-family: Helvetica, Arial, sans-serif; font-size: 32px; letter-spacing: 8px; font-weight: 600; margin: 0 0 20px;">{{ .Token }}</p>
  <p style="font-family: Helvetica, Arial, sans-serif; font-size: 13px; color: #6b6459; margin: 0;">
    Didn't ask for this? You can ignore this email.
  </p>
</div>
